<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Backup Dashboard — ประวัติการสำรองข้อมูล</title>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --border: #dfe4ec;
    --text: #16202e;
    --muted: #667487;
    --accent: #2563eb;
    --ok: #1a8a4a;
    --ok-bg: #e4f5ea;
    --warn: #a86400;
    --warn-bg: #fdf1dc;
    --bad: #c62b32;
    --bad-bg: #fdeaea;
    --shadow: 0 1px 2px rgba(16, 32, 46, .06), 0 1px 8px rgba(16, 32, 46, .04);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f151d;
      --surface: #161e29;
      --surface-2: #1b2532;
      --border: #2a3646;
      --text: #e6ecf4;
      --muted: #93a1b5;
      --accent: #6ea8ff;
      --ok: #56d38a;
      --ok-bg: #14301f;
      --warn: #f0b348;
      --warn-bg: #33270e;
      --bad: #ff8087;
      --bad-bg: #3a1719;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Sarabun", sans-serif;
  }
  h1, h2 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; color: var(--muted); margin-bottom: 10px; }
  a { color: var(--accent); }

  .topbar {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between;
    padding: 14px 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .stamp { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  button, select, input {
    font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 11px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: progress; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 12px; background: var(--surface); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  main { max-width: 1440px; margin: 0 auto; padding: 20px 22px 60px; }
  section { margin-bottom: 26px; }

  .banner {
    display: block;
    padding: 11px 14px; margin: 0 0 20px;
    border-radius: var(--radius); font-size: 14px;
    border: 1px solid var(--border); background: var(--warn-bg); color: var(--warn);
  }
  .banner.bad { background: var(--bad-bg); color: var(--bad); }
  .banner b { font-weight: 650; }

  .kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .value { font-size: 24px; font-weight: 650; margin-top: 4px; letter-spacing: -.02em; }
  .kpi .note { font-size: 12px; color: var(--muted); margin-top: 3px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kpi.ok .value { color: var(--ok); }
  .kpi.warn .value { color: var(--warn); }
  .kpi.bad .value { color: var(--bad); }

  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(285px, 1fr)); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--muted);
    border-radius: var(--radius); padding: 13px 15px; box-shadow: var(--shadow);
  }
  .card.ok { border-left-color: var(--ok); }
  .card.late { border-left-color: var(--warn); }
  .card.overdue, .card.failed { border-left-color: var(--bad); }
  .card .name { font-weight: 600; margin-bottom: 6px; overflow-wrap: anywhere; }
  .card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; font-size: 13px; }
  .card dt { color: var(--muted); white-space: nowrap; }
  .card dd { margin: 0; overflow-wrap: anywhere; }

  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 99px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.late, .pill.running { background: var(--warn-bg); color: var(--warn); }
  .pill.overdue, .pill.failed, .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.plain { background: var(--surface-2); color: var(--muted); }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .tl { padding: 14px 16px; overflow-x: auto; }
  .tl-row { display: grid; grid-template-columns: minmax(170px, 230px) 1fr; gap: 12px; align-items: center; margin-bottom: 6px; }
  .tl-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-cells { display: grid; grid-template-columns: repeat(90, 1fr); gap: 2px; min-width: 460px; }
  .tl-cells i { display: block; height: 17px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--border); }
  .tl-cells i.s { background: var(--ok); border-color: var(--ok); }
  .tl-cells i.f { background: var(--bad); border-color: var(--bad); }
  .tl-legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 10px; align-items: center; }
  .tl-legend span { display: flex; gap: 6px; align-items: center; }
  .tl-legend i { width: 11px; height: 11px; border-radius: 2px; display: block; border: 1px solid var(--border); }
  .tl-legend em { font-style: normal; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  .filters input[type="search"] { min-width: 220px; flex: 1 1 240px; }
  .filters .count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .filters .daterange { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .filters .daterange input { font-size: 13px; padding: 5px 8px; }
  /* ช่อง date แสดงรูปแบบตามภาษาของเบราว์เซอร์ (มักเป็น mm/dd/yyyy) ป้ายนี้จึงย้ำวันที่
     ด้วยรูปแบบภาษาที่หน้าเว็บใช้อยู่ กันอ่านสลับเดือนกับวัน */
  .dateEcho {
    font-size: 12px; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 99px; padding: 3px 10px; white-space: nowrap;
  }

  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--surface-2); color: var(--muted); font-weight: 600; }
  th[data-key] { cursor: pointer; user-select: none; }
  th[data-key]:hover { color: var(--accent); }
  th.num { text-align: right; }
  th .arrow { opacity: .45; font-size: 10px; }
  tbody tr.row { cursor: pointer; }
  tbody tr.row:hover { background: var(--surface-2); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.src { white-space: normal; min-width: 200px; overflow-wrap: anywhere; }
  .detail td { background: var(--surface-2); white-space: normal; }
  .detail dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
  .detail dt { color: var(--muted); white-space: nowrap; }
  .detail dd { margin: 0; overflow-wrap: anywhere; }
  .empty { padding: 34px; text-align: center; color: var(--muted); }

  .pager {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center;
    padding: 12px 14px; border-top: 1px solid var(--border); background: var(--surface-2);
  }
  .pager button { padding: 5px 10px; min-width: 36px; font-variant-numeric: tabular-nums; }
  .pager button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .pager .gap { color: var(--muted); padding: 0 2px; }
  .pager .info { font-size: 12px; color: var(--muted); margin-left: 10px; font-variant-numeric: tabular-nums; }
  .pager .jump { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin-left: 10px; }
  .pager .jump input { width: 68px; padding: 5px 8px; text-align: center; font-variant-numeric: tabular-nums; }

  @media (max-width: 640px) {
    .topbar { padding: 12px 14px; }
    main { padding: 16px 14px 50px; }
    .tl-row { grid-template-columns: 1fr; gap: 4px; }
    .filters .count { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </div>
  <div class="toolbar">
    <span class="stamp" id="stamp"></span>
    <button id="refreshBtn" data-i18n="refresh"></button>
    <div class="seg" role="group" aria-label="language">
      <button data-lang="th">ไทย</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>
  <div class="banner" id="banner" hidden></div>

  <section>
    <h2 data-i18n="overview"></h2>
    <div class="kpis" id="kpis"></div>
  </section>

  <section>
    <h2 data-i18n="bySystem"></h2>
    <div class="cards" id="cards"></div>
  </section>

  <section>
    <h2 data-i18n="timelineTitle"></h2>
    <div class="panel">
      <div class="tl">
        <div id="timeline"></div>
        <div class="tl-legend">
          <span><i style="background:var(--ok);border-color:var(--ok)"></i><em data-i18n="lgSuccess"></em></span>
          <span><i style="background:var(--bad);border-color:var(--bad)"></i><em data-i18n="lgFailed"></em></span>
          <span><i style="background:var(--surface-2)"></i><em data-i18n="lgNone"></em></span>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2 data-i18n="historyTitle"></h2>
    <div class="panel">
      <div class="filters">
        <input type="search" id="q" data-i18n-ph="searchPh">
        <select id="fSource"></select>
        <select id="fStatus"></select>
        <label class="daterange"><span data-i18n="dateFrom"></span><input type="date" id="fFrom"></label>
        <label class="daterange"><span data-i18n="dateTo"></span><input type="date" id="fTo"></label>
        <span class="dateEcho" id="dateEcho" hidden></span>
        <button id="clearBtn" data-i18n="clear"></button>
        <button id="csvBtn" data-i18n="exportCsv"></button>
        <select id="pageSize" aria-label="rows per page"></select>
        <span class="count" id="count"></span>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pager" id="pager" hidden></div>
    </div>
  </section>
</main>

<script>
// ---------------------------------------------------------------------------
// ข้อความทั้งหมดรวมไว้ที่เดียว แก้คำง่ายและกันคำแปลตกหล่น
// ---------------------------------------------------------------------------
const T = {
  th: {
    locale: 'th-TH',
    title: 'ประวัติการสำรองข้อมูล',
    subtitle: 'backup เมื่อไหร่ · backup อะไร · ใครเป็นคนทำ',
    refresh: 'รีเฟรช',
    refreshing: 'กำลังโหลด…',
    stamp: (time) => 'ข้อมูล ณ ' + time,
    demoBanner: '<b>โหมดตัวอย่าง</b> — ข้อมูลที่เห็นเป็นข้อมูลสมมติ ยังไม่ได้ตั้งค่า DATABASE_URL ในไฟล์ .env',
    errorBanner: (detail) => '<b>เชื่อมต่อฐานข้อมูลไม่ได้</b> — ' + detail,

    overview: 'ภาพรวม',
    kpiLatest: 'backup ล่าสุด',
    kpiLatestNone: 'ยังไม่มีข้อมูล',
    kpi30: 'ผลใน 30 วันล่าสุด',
    kpi30Note: (ok, fail) => ok + ' สำเร็จ · ' + fail + ' ล้มเหลว',
    kpiSize: 'ขนาดรวม 30 วัน',
    kpiSizeNote: (n) => 'จาก ' + n + ' ครั้ง',
    kpiAttention: 'ระบบที่ต้องดู',
    kpiAttentionOk: 'ทุกระบบ backup ตามรอบ',
    kpiRestore: 'ค้างทดสอบ restore',
    kpiRestoreNote: (n, all) => n + ' จาก ' + all + ' ระบบ',
    kpiRestoreOk: 'ทดสอบครบทุกระบบ',
    systemsUnit: (n) => n + ' ระบบ',

    bySystem: 'สถานะรายระบบ',
    lastBackup: 'ล่าสุด',
    by: 'โดย',
    dest: 'ที่เก็บ',
    restoreTest: 'ทดสอบ restore',
    everyLabel: 'รอบปกติ',
    never: 'ยังไม่เคยทดสอบ',
    noData: 'ไม่มีข้อมูล',

    timelineTitle: 'ไทม์ไลน์ 90 วันล่าสุด',
    lgSuccess: 'สำเร็จ',
    lgFailed: 'ล้มเหลว',
    lgNone: 'ไม่มี backup',

    historyTitle: 'ประวัติทั้งหมด',
    searchPh: 'ค้นหา ระบบ / คนทำ / ที่เก็บ / หมายเหตุ…',
    allSources: 'ทุกระบบ',
    allStatuses: 'ทุกสถานะ',
    dateFrom: 'ตั้งแต่',
    dateTo: 'ถึง',
    dateBoth: (from, to) => from + ' – ' + to,
    dateFromOnly: (from) => 'ตั้งแต่ ' + from,
    dateToOnly: (to) => 'ถึง ' + to,
    clear: 'ล้างตัวกรอง',
    exportCsv: 'ดาวน์โหลด CSV',
    countLabel: (n, all) => 'แสดง ' + n + ' จาก ' + all + ' รายการ',
    countRange: (from, to, all) => 'แสดง ' + from + '–' + to + ' จาก ' + all + ' รายการ',
    emptyFiltered: 'ไม่พบรายการที่ตรงกับตัวกรอง',

    perPage: (n) => n + ' แถว/หน้า',
    allRows: 'ทั้งหมด',
    first: '«',
    prev: '‹',
    next: '›',
    last: '»',
    pageInfo: (page, total) => 'หน้า ' + page + ' จาก ' + total,
    goToPage: (n) => 'ไปหน้า ' + n,
    jumpLabel: 'ไปหน้า',
    jumpGo: 'ไป',

    col: {
      backed_up_at: 'วันเวลา', source: 'ระบบ / ข้อมูล', backup_type: 'ประเภท', status: 'สถานะ',
      performed_by: 'ผู้ทำ', destination: 'ที่เก็บ', size_bytes: 'ขนาด',
      duration_seconds: 'ใช้เวลา', retention_days: 'เก็บไว้', last_restore_test_at: 'ทดสอบ restore',
    },
    notes: 'หมายเหตุ',
    evidence: 'หลักฐาน',
    recordId: 'รหัสรายการ',

    status: { success: 'สำเร็จ', failed: 'ล้มเหลว', running: 'กำลังทำ' },
    type: { full: 'เต็ม', incremental: 'เพิ่มเติม', differential: 'ส่วนต่าง', manual: 'ทำมือ' },
    health: { ok: 'ปกติ', late: 'เลยรอบ', overdue: 'ขาดนาน', failed: 'ล้มเหลว' },
    testResult: { passed: 'ผ่าน', failed: 'ไม่ผ่าน' },
    days: (n) => n + ' วัน',
  },

  en: {
    locale: 'en-GB',
    title: 'Backup history',
    subtitle: 'when it ran · what was backed up · who did it',
    refresh: 'Refresh',
    refreshing: 'Loading…',
    stamp: (time) => 'As of ' + time,
    demoBanner: '<b>Demo mode</b> — showing sample data; DATABASE_URL is not set in .env',
    errorBanner: (detail) => '<b>Cannot reach the database</b> — ' + detail,

    overview: 'Overview',
    kpiLatest: 'Latest backup',
    kpiLatestNone: 'No data yet',
    kpi30: 'Last 30 days',
    kpi30Note: (ok, fail) => ok + ' succeeded · ' + fail + ' failed',
    kpiSize: 'Total size, 30 days',
    kpiSizeNote: (n) => 'across ' + n + ' runs',
    kpiAttention: 'Needs attention',
    kpiAttentionOk: 'Every system is on schedule',
    kpiRestore: 'Restore tests due',
    kpiRestoreNote: (n, all) => n + ' of ' + all + ' systems',
    kpiRestoreOk: 'All systems tested',
    systemsUnit: (n) => n + (n === 1 ? ' system' : ' systems'),

    bySystem: 'By system',
    lastBackup: 'Last run',
    by: 'By',
    dest: 'Stored at',
    restoreTest: 'Restore test',
    everyLabel: 'Usual interval',
    never: 'Never tested',
    noData: 'No data',

    timelineTitle: 'Last 90 days',
    lgSuccess: 'Success',
    lgFailed: 'Failed',
    lgNone: 'No backup',

    historyTitle: 'Full history',
    searchPh: 'Search source / person / destination / notes…',
    allSources: 'All systems',
    allStatuses: 'All statuses',
    dateFrom: 'From',
    dateTo: 'To',
    dateBoth: (from, to) => from + ' – ' + to,
    dateFromOnly: (from) => 'From ' + from,
    dateToOnly: (to) => 'To ' + to,
    clear: 'Clear filters',
    exportCsv: 'Download CSV',
    countLabel: (n, all) => 'Showing ' + n + ' of ' + all,
    countRange: (from, to, all) => 'Showing ' + from + '–' + to + ' of ' + all,
    emptyFiltered: 'No records match these filters',

    perPage: (n) => n + ' rows/page',
    allRows: 'All',
    first: '«',
    prev: '‹',
    next: '›',
    last: '»',
    pageInfo: (page, total) => 'Page ' + page + ' of ' + total,
    goToPage: (n) => 'Go to page ' + n,
    jumpLabel: 'Go to page',
    jumpGo: 'Go',

    col: {
      backed_up_at: 'When', source: 'Source', backup_type: 'Type', status: 'Status',
      performed_by: 'Performed by', destination: 'Destination', size_bytes: 'Size',
      duration_seconds: 'Duration', retention_days: 'Retention', last_restore_test_at: 'Restore test',
    },
    notes: 'Notes',
    evidence: 'Evidence',
    recordId: 'Record id',

    status: { success: 'Success', failed: 'Failed', running: 'Running' },
    type: { full: 'Full', incremental: 'Incremental', differential: 'Differential', manual: 'Manual' },
    health: { ok: 'On schedule', late: 'Late', overdue: 'Long overdue', failed: 'Failed' },
    testResult: { passed: 'Passed', failed: 'Failed' },
    days: (n) => n + (n === 1 ? ' day' : ' days'),
  },
};

const DAY = 86400000;
const RESTORE_TEST_MAX_DAYS = 180;   // เกินกว่านี้ถือว่าค้างทดสอบ restore
const TIMELINE_DAYS = 90;
const COLUMNS = ['backed_up_at', 'source', 'backup_type', 'status', 'performed_by',
                 'destination', 'size_bytes', 'duration_seconds', 'retention_days', 'last_restore_test_at'];
const NUMERIC_COLS = new Set(['size_bytes', 'duration_seconds', 'retention_days']);
const PAGE_SIZES = [5, 10, 15, 50, 'all'];

let lang = localStorage.getItem('backupDashboardLang') === 'en' ? 'en' : 'th';

// จำจำนวนแถวต่อหน้าไว้ เพราะเป็นความชอบส่วนตัวของคนดู ไม่ใช่สถานะของข้อมูล
const savedSize = localStorage.getItem('backupDashboardPageSize');
const initialSize = savedSize === 'all' ? 'all' : Number(savedSize);

const state = {
  records: [], demo: false, fetchedAt: null, error: null, loading: false,
  filters: { q: '', source: '', status: '', from: '', to: '' },
  sort: { key: 'backed_up_at', dir: 'desc' },
  expanded: new Set(),
  pageSize: PAGE_SIZES.includes(initialSize) ? initialSize : 15,
  page: 1,
};
const t = () => T[lang];

// --- ตัวช่วยจัดรูปแบบ --------------------------------------------------------
const ENTITIES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ENTITIES[c]);

function fmtDateTime(iso) {
  if (!iso) return '—';
  return new Intl.DateTimeFormat(t().locale, { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(iso));
}
function fmtDate(iso) {
  if (!iso) return '—';
  return new Intl.DateTimeFormat(t().locale, { dateStyle: 'medium' }).format(new Date(iso));
}
function fmtRelative(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const rtf = new Intl.RelativeTimeFormat(t().locale, { numeric: 'auto' });
  const units = [['year', 365 * DAY], ['month', 30 * DAY], ['day', DAY], ['hour', 3600000], ['minute', 60000]];
  for (const [unit, ms] of units) {
    if (Math.abs(diff) >= ms || unit === 'minute') return rtf.format(-Math.round(diff / ms), unit);
  }
}
function fmtBytes(bytes) {
  if (bytes == null) return '—';
  const units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
  let i = 0, value = Number(bytes);
  while (value >= 1024 && i < units.length - 1) { value /= 1024; i++; }
  const digits = i > 0 && value < 10 ? 1 : 0;
  return new Intl.NumberFormat(t().locale, { maximumFractionDigits: digits }).format(value) + ' ' + units[i];
}
function fmtDuration(seconds) {
  if (seconds == null) return '—';
  const s = Number(seconds);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.round(s / 60) + 'm';
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h + 'h' + (m ? ' ' + m + 'm' : '');
}
function fmtInterval(ms) {
  if (!ms) return '—';
  if (ms < 1.5 * 3600000) return Math.round(ms / 60000) + 'm';
  if (ms < 36 * 3600000) return Math.round(ms / 3600000) + 'h';
  return t().days(Math.round(ms / DAY));
}
// คีย์รายวันตามเวลาท้องถิ่น — ไทม์ไลน์ต้องตรงกับ "วัน" ที่คนดูเข้าใจ ไม่ใช่ UTC
function dayKey(iso) {
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// --- คำนวณสถานะรายระบบ -------------------------------------------------------
// "รอบปกติ" ของแต่ละระบบใช้ค่ามัธยฐานของช่วงห่างจริงระหว่าง backup แต่ละครั้ง
// จึงไม่ต้องตั้งตารางเวลาไว้ล่วงหน้า และใช้ได้ทั้งงานรายชั่วโมงและรายเดือน
function buildSystems(records) {
  const groups = new Map();
  for (const r of records) {
    if (!groups.has(r.source)) groups.set(r.source, []);
    groups.get(r.source).push(r);
  }

  const systems = [];
  for (const [source, list] of groups) {
    list.sort((a, b) => new Date(b.backed_up_at) - new Date(a.backed_up_at));
    const latest = list[0];

    const gaps = [];
    for (let i = 0; i < list.length - 1; i++) {
      gaps.push(new Date(list[i].backed_up_at) - new Date(list[i + 1].backed_up_at));
    }
    gaps.sort((a, b) => a - b);
    const expected = gaps.length ? gaps[Math.floor(gaps.length / 2)] : DAY;
    const age = Date.now() - new Date(latest.backed_up_at).getTime();

    let health = 'ok';
    if (latest.status === 'failed') health = 'failed';
    else if (age > expected * 3) health = 'overdue';
    else if (age > expected * 1.5) health = 'late';

    const testedAt = latest.last_restore_test_at;
    const restoreDue =
      !testedAt ||
      latest.last_restore_test_result === 'failed' ||
      Date.now() - new Date(testedAt).getTime() > RESTORE_TEST_MAX_DAYS * DAY;

    systems.push({ source, latest, records: list, expected, health, restoreDue });
  }

  const rank = { failed: 0, overdue: 1, late: 2, ok: 3 };
  return systems.sort((a, b) => rank[a.health] - rank[b.health] || a.source.localeCompare(b.source));
}

function applyStaticText() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t()[el.dataset.i18n];
  for (const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder = t()[el.dataset.i18nPh];
  for (const el of document.querySelectorAll('[data-lang]')) {
    el.setAttribute('aria-pressed', String(el.dataset.lang === lang));
  }
  const btn = document.getElementById('refreshBtn');
  btn.textContent = state.loading ? t().refreshing : t().refresh;
  btn.disabled = state.loading;
}

function renderBanner() {
  const el = document.getElementById('banner');
  if (state.error) {
    el.className = 'banner bad';
    el.innerHTML = t().errorBanner(esc(state.error));
    el.hidden = false;
  } else if (state.demo) {
    el.className = 'banner';
    el.innerHTML = t().demoBanner;
    el.hidden = false;
  } else {
    el.hidden = true;
  }
  document.getElementById('stamp').textContent =
    state.fetchedAt ? t().stamp(fmtDateTime(state.fetchedAt)) : '';
}

function renderKpis(systems) {
  const now = Date.now();
  const last30 = state.records.filter((r) => now - new Date(r.backed_up_at).getTime() <= 30 * DAY);
  const ok30 = last30.filter((r) => r.status === 'success').length;
  const fail30 = last30.filter((r) => r.status === 'failed').length;
  const size30 = last30.reduce((sum, r) => sum + Number(r.size_bytes ?? 0), 0);
  const attention = systems.filter((s) => s.health !== 'ok');
  const restoreDue = systems.filter((s) => s.restoreDue);
  const latest = state.records.reduce(
    (best, r) => (!best || new Date(r.backed_up_at) > new Date(best.backed_up_at) ? r : best), null);

  const tiles = [
    { cls: latest ? '' : 'warn', label: t().kpiLatest,
      value: latest ? fmtRelative(latest.backed_up_at) : t().kpiLatestNone,
      note: latest ? latest.source : '' },
    { cls: fail30 ? 'warn' : 'ok', label: t().kpi30,
      value: ok30 + ' / ' + last30.length, note: t().kpi30Note(ok30, fail30) },
    { cls: '', label: t().kpiSize, value: fmtBytes(size30), note: t().kpiSizeNote(last30.length) },
    { cls: attention.length ? 'bad' : 'ok', label: t().kpiAttention,
      value: t().systemsUnit(attention.length),
      note: attention.length ? attention.map((s) => s.source).join(', ') : t().kpiAttentionOk },
    { cls: restoreDue.length ? 'warn' : 'ok', label: t().kpiRestore,
      value: t().systemsUnit(restoreDue.length),
      note: restoreDue.length ? t().kpiRestoreNote(restoreDue.length, systems.length) : t().kpiRestoreOk },
  ];

  document.getElementById('kpis').innerHTML = tiles.map((k) => `
    <div class="kpi ${k.cls}">
      <div class="label">${esc(k.label)}</div>
      <div class="value">${esc(k.value)}</div>
      <div class="note" title="${esc(k.note)}">${esc(k.note)}</div>
    </div>`).join('');
}

function renderCards(systems) {
  const el = document.getElementById('cards');
  if (!systems.length) { el.innerHTML = '<div class="empty">' + esc(t().noData) + '</div>'; return; }

  el.innerHTML = systems.map((s) => {
    const r = s.latest;
    const test = r.last_restore_test_at
      ? fmtDate(r.last_restore_test_at) +
        (r.last_restore_test_result ? ' (' + t().testResult[r.last_restore_test_result] + ')' : '')
      : t().never;
    return `
    <div class="card ${s.health}">
      <div class="name">${esc(s.source)}</div>
      <div style="margin-bottom:8px">
        <span class="pill ${s.health}">${esc(t().health[s.health])}</span>
        <span class="pill plain">${esc(t().type[r.backup_type] ?? r.backup_type)}</span>
      </div>
      <dl>
        <dt>${esc(t().lastBackup)}</dt><dd>${esc(fmtRelative(r.backed_up_at))} · ${esc(fmtDateTime(r.backed_up_at))}</dd>
        <dt>${esc(t().by)}</dt><dd>${esc(r.performed_by)}</dd>
        <dt>${esc(t().dest)}</dt><dd>${esc(r.destination ?? '—')}</dd>
        <dt>${esc(t().everyLabel)}</dt><dd>${esc(fmtInterval(s.expected))} · ${esc(fmtBytes(r.size_bytes))}</dd>
        <dt>${esc(t().restoreTest)}</dt>
        <dd${s.restoreDue ? ' style="color:var(--warn)"' : ''}>${esc(test)}</dd>
      </dl>
    </div>`;
  }).join('');
}

function renderTimeline(systems) {
  const el = document.getElementById('timeline');
  if (!systems.length) { el.innerHTML = '<div class="empty">' + esc(t().noData) + '</div>'; return; }

  // วันล่าสุดอยู่ขวาสุด อ่านเหมือนไทม์ไลน์ปกติ
  const days = [];
  for (let i = TIMELINE_DAYS - 1; i >= 0; i--) days.push(dayKey(new Date(Date.now() - i * DAY)));

  el.innerHTML = systems.map((s) => {
    const byDay = new Map();
    for (const r of s.records) {
      const key = dayKey(r.backed_up_at);
      // ล้มเหลวสำคัญกว่า — วันไหนมีทั้งสำเร็จและล้มเหลว ให้ขึ้นสีแดงไว้ก่อน
      if (r.status === 'failed' || !byDay.has(key)) byDay.set(key, r.status);
    }
    const cells = days.map((d) => {
      const status = byDay.get(d);
      const cls = status === 'failed' ? 'f' : status ? 's' : '';
      const label = status ? (t().status[status] ?? status) : t().lgNone;
      return `<i class="${cls}" title="${esc(d + ' · ' + label)}"></i>`;
    }).join('');
    return `<div class="tl-row">
      <div class="tl-name" title="${esc(s.source)}">${esc(s.source)}</div>
      <div class="tl-cells">${cells}</div>
    </div>`;
  }).join('');
}

function filteredRecords() {
  const f = state.filters;
  const q = f.q.trim().toLowerCase();
  const from = f.from ? new Date(f.from + 'T00:00:00').getTime() : null;
  const to = f.to ? new Date(f.to + 'T23:59:59.999').getTime() : null;

  const rows = state.records.filter((r) => {
    if (f.source && r.source !== f.source) return false;
    if (f.status && r.status !== f.status) return false;
    const ts = new Date(r.backed_up_at).getTime();
    if (from && ts < from) return false;
    if (to && ts > to) return false;
    if (q) {
      const hay = [r.source, r.performed_by, r.destination, r.notes, r.backup_type, r.status]
        .join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const { key, dir } = state.sort;
  const sign = dir === 'asc' ? 1 : -1;
  return rows.sort((a, b) => {
    const x = a[key], y = b[key];
    if (x == null && y == null) return 0;
    if (x == null) return 1;                       // ค่าว่างไปท้ายเสมอ ไม่ว่าจะเรียงทางไหน
    if (y == null) return -1;
    if (NUMERIC_COLS.has(key)) return (Number(x) - Number(y)) * sign;
    return String(x).localeCompare(String(y), t().locale) * sign;
  });
}

function renderTable() {
  const rows = filteredRecords();

  // แบ่งหน้า: 'all' คือไม่แบ่ง ส่วนเลขอื่นตัดเป็นช่วงตามหน้าที่เลือก
  const showAll = state.pageSize === 'all';
  const perPage = showAll ? Math.max(rows.length, 1) : state.pageSize;
  const totalPages = Math.max(1, Math.ceil(rows.length / perPage));
  // กรองแล้วแถวอาจเหลือน้อยกว่าหน้าที่ค้างอยู่ — ดึงกลับมาให้อยู่ในช่วงที่มีจริง
  if (state.page > totalPages) state.page = totalPages;
  if (state.page < 1) state.page = 1;
  const start = showAll ? 0 : (state.page - 1) * perPage;
  const pageRows = showAll ? rows : rows.slice(start, start + perPage);

  document.getElementById('thead').innerHTML = COLUMNS.map((key) => {
    const active = state.sort.key === key;
    const arrow = active ? (state.sort.dir === 'asc' ? '▲' : '▼') : '';
    return `<th data-key="${key}"${NUMERIC_COLS.has(key) ? ' class="num"' : ''}>` +
           esc(t().col[key]) + ` <span class="arrow">${arrow}</span></th>`;
  }).join('');

  const tbody = document.getElementById('tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="${COLUMNS.length}" class="empty">${esc(t().emptyFiltered)}</td></tr>`;
  } else {
    tbody.innerHTML = pageRows.map((r) => {
      const test = r.last_restore_test_at
        ? fmtDate(r.last_restore_test_at) + (r.last_restore_test_result === 'failed' ? ' ⚠' : '')
        : '—';
      const main = `
        <tr class="row" data-id="${esc(r.id)}">
          <td>${esc(fmtDateTime(r.backed_up_at))}</td>
          <td class="src">${esc(r.source)}</td>
          <td><span class="pill plain">${esc(t().type[r.backup_type] ?? r.backup_type)}</span></td>
          <td><span class="pill ${r.status === 'success' ? 'ok' : esc(r.status)}">${esc(t().status[r.status] ?? r.status)}</span></td>
          <td>${esc(r.performed_by)}</td>
          <td>${esc(r.destination ?? '—')}</td>
          <td class="num">${esc(fmtBytes(r.size_bytes))}</td>
          <td class="num">${esc(fmtDuration(r.duration_seconds))}</td>
          <td class="num">${esc(r.retention_days == null ? '—' : t().days(r.retention_days))}</td>
          <td>${esc(test)}</td>
        </tr>`;
      if (!state.expanded.has(r.id)) return main;

      // พาธในเครือข่าย (\\server\share) เปิดจากเบราว์เซอร์ไม่ได้ จึงแสดงเป็นข้อความให้คัดลอกแทน
      const evidence = r.evidence_url
        ? (/^https?:/i.test(r.evidence_url)
            ? `<a href="${esc(r.evidence_url)}" target="_blank" rel="noopener">${esc(r.evidence_url)}</a>`
            : esc(r.evidence_url))
        : '—';
      return main + `
        <tr class="detail"><td colspan="${COLUMNS.length}">
          <dl>
            <dt>${esc(t().notes)}</dt><dd>${esc(r.notes ?? '—')}</dd>
            <dt>${esc(t().evidence)}</dt><dd>${evidence}</dd>
            <dt>${esc(t().recordId)}</dt><dd>#${esc(r.id)}</dd>
          </dl>
        </td></tr>`;
    }).join('');
  }

  document.getElementById('count').textContent = rows.length
    ? t().countRange(start + 1, start + pageRows.length, rows.length)
    : t().countLabel(0, state.records.length);

  renderDateEcho();
  renderPager(totalPages);
}

// ย้ำช่วงวันที่ที่เลือกด้วยรูปแบบของภาษาที่หน้าเว็บใช้อยู่ — ช่อง <input type="date">
// แสดงผลตามภาษาของเบราว์เซอร์ ไม่ใช่ของหน้าเว็บ คนอ่านจึงสลับวันกับเดือนได้ง่าย
function renderDateEcho() {
  const el = document.getElementById('dateEcho');
  const { from, to } = state.filters;
  if (!from && !to) { el.hidden = true; el.textContent = ''; return; }

  const day = (value) => fmtDate(value + 'T00:00:00');
  el.textContent = from && to
    ? t().dateBoth(day(from), day(to))
    : from ? t().dateFromOnly(day(from)) : t().dateToOnly(day(to));
  el.hidden = false;
}

// เลขหน้าที่จะแสดง: หน้าแรก หน้าสุดท้าย และหน้ารอบๆ ที่อยู่ตอนนี้
// รายการอาจมีหลายพันแถว จึงไม่พ่นปุ่มออกมาทุกหน้า
function pageWindow(current, total) {
  const wanted = new Set([1, total, current - 1, current, current + 1]);
  if (current <= 3) [2, 3, 4].forEach((n) => wanted.add(n));
  if (current >= total - 2) [total - 1, total - 2, total - 3].forEach((n) => wanted.add(n));
  return [...wanted].filter((n) => n >= 1 && n <= total).sort((a, b) => a - b);
}

function renderPager(totalPages) {
  const el = document.getElementById('pager');
  if (state.pageSize === 'all' || totalPages <= 1) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;

  const page = state.page;
  const step = (target, label, disabled) =>
    `<button data-page="${target}"${disabled ? ' disabled' : ''}>${esc(label)}</button>`;

  const numbers = [];
  let previous = 0;
  for (const n of pageWindow(page, totalPages)) {
    if (n - previous > 1) numbers.push('<span class="gap">…</span>');
    numbers.push(
      `<button data-page="${n}" title="${esc(t().goToPage(n))}"` +
      `${n === page ? ' aria-current="page"' : ''}>${n}</button>`);
    previous = n;
  }

  el.innerHTML =
    step(1, t().first, page === 1) +
    step(page - 1, t().prev, page === 1) +
    numbers.join('') +
    step(page + 1, t().next, page === totalPages) +
    step(totalPages, t().last, page === totalPages) +
    `<span class="info">${esc(t().pageInfo(page, totalPages))}</span>` +
    // ปุ่มเลขหน้าแสดงแค่หน้ารอบๆ ตัว — ช่องนี้ไว้กระโดดไปหน้าไหนก็ได้โดยไม่ต้องกดทีละหน้า
    `<span class="jump">
       <label for="jumpPage">${esc(t().jumpLabel)}</label>
       <input type="number" id="jumpPage" inputmode="numeric" min="1" max="${totalPages}"
              placeholder="${page}" aria-label="${esc(t().jumpLabel)}">
       <button data-jump>${esc(t().jumpGo)}</button>
     </span>`;
}

function renderPageSizeOptions() {
  const sel = document.getElementById('pageSize');
  sel.innerHTML = PAGE_SIZES.map((n) =>
    `<option value="${n}">${esc(n === 'all' ? t().allRows : t().perPage(n))}</option>`).join('');
  sel.value = String(state.pageSize);
}

function renderFilterOptions() {
  const sources = [...new Set(state.records.map((r) => r.source))].sort((a, b) => a.localeCompare(b));
  const sourceSel = document.getElementById('fSource');
  sourceSel.innerHTML = `<option value="">${esc(t().allSources)}</option>` +
    sources.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  sourceSel.value = state.filters.source;

  const statusSel = document.getElementById('fStatus');
  statusSel.innerHTML = `<option value="">${esc(t().allStatuses)}</option>` +
    ['success', 'failed', 'running'].map((s) => `<option value="${s}">${esc(t().status[s])}</option>`).join('');
  statusSel.value = state.filters.status;
}

function render() {
  const systems = buildSystems(state.records);
  applyStaticText();
  renderBanner();
  renderKpis(systems);
  renderCards(systems);
  renderTimeline(systems);
  renderFilterOptions();
  renderPageSizeOptions();
  renderTable();
}

// --- โหลดข้อมูล --------------------------------------------------------------
async function load() {
  // ไฟล์ที่ export ไว้จะมีข้อมูลฝังมาแล้ว เปิดแบบ file:// ได้โดยไม่ต้องมีเซิร์ฟเวอร์
  if (window.__BACKUP_DATA__) {
    state.records = window.__BACKUP_DATA__.records ?? [];
    state.demo = Boolean(window.__BACKUP_DATA__.demo);
    state.fetchedAt = window.__BACKUP_DATA__.exportedAt ?? null;
    render();
    return;
  }

  state.loading = true;
  applyStaticText();
  try {
    const res = await fetch('api/backups', { cache: 'no-store' });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail ?? body.error ?? ('HTTP ' + res.status));
    state.records = body.records ?? [];
    state.demo = Boolean(body.demo);
    state.fetchedAt = body.fetchedAt ?? new Date().toISOString();
    state.error = null;
  } catch (err) {
    state.error = err.message;
  } finally {
    state.loading = false;
    render();
  }
}

function downloadCsv() {
  const rows = filteredRecords();
  const cols = ['id', 'backed_up_at', 'source', 'performed_by', 'status', 'backup_type', 'destination',
                'size_bytes', 'duration_seconds', 'retention_days',
                'last_restore_test_at', 'last_restore_test_result', 'evidence_url', 'notes'];
  const cell = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = [cols.join(','), ...rows.map((r) => cols.map((c) => cell(r[c])).join(','))]
    .join(String.fromCharCode(13, 10));

  // BOM นำหน้า เพื่อให้ Excel บน Windows อ่านภาษาไทยไม่เพี้ยน
  const blob = new Blob([String.fromCharCode(0xFEFF) + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'backup-history-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

  renderTable();
});

// ผู้ใช้อยู่ท้ายตารางตอนกดเปลี่ยนหน้า — เลื่อนกลับไปหัวตารางให้เห็นแถวแรกของหน้าใหม่
function goToPage(n) {
  state.page = n;
  renderTable();
  document.getElementById('thead').scrollIntoView({ block: 'nearest' });
}

// อ่านเลขจากช่องกระโดดหน้า แล้วบีบให้อยู่ในช่วงที่มีจริง
// พิมพ์ 999 ทั้งที่มี 57 หน้า = ไปหน้าสุดท้าย ดีกว่าไม่เกิดอะไรขึ้นเลยแล้วผู้ใช้งง
function jumpToTypedPage() {
  const input = document.getElementById('jumpPage');
  if (!input) return;
  const wanted = Number(input.value);
  if (!input.value.trim() || !Number.isFinite(wanted)) return;
  goToPage(Math.min(Math.max(1, Math.round(wanted)), Number(input.max)));
}

document.getElementById('pager').addEventListener('click', (e) => {
  if (e.target.closest('button[data-jump]')) return jumpToTypedPage();
  const target = e.target.closest('button[data-page]');
  if (!target || target.disabled) return;
  goToPage(Number(target.dataset.page));
});

document.getElementById('pager').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'jumpPage') {
    e.preventDefault();
    jumpToTypedPage();
  }
});

document.getElementById('thead').addEventListener('click', (e) => {
  const key = e.target.closest('th')?.dataset.key;
  if (!key) return;
  // คลิกคอลัมน์เดิม = สลับทิศ, คอลัมน์ใหม่ = เริ่มจากมากไปน้อย ซึ่งเป็นสิ่งที่คนอยากเห็นก่อน
  state.sort = key === state.sort.key
    ? { key, dir: state.sort.dir === 'asc' ? 'desc' : 'asc' }
    : { key, dir: 'desc' };
  state.page = 1;               // เรียงใหม่แล้วแถวย้ายไปหมด กลับไปหน้าแรกจึงตรงกับที่ผู้ใช้คาด
  renderTable();
});

document.getElementById('tbody').addEventListener('click', (e) => {
  if (e.target.closest('a')) return;
  const row = e.target.closest('tr.row');
  if (!row) return;
  const id = Number(row.dataset.id);
  if (state.expanded.has(id)) state.expanded.delete(id);
  else state.expanded.add(id);
  renderTable();
});

// หน้านี้มักถูกเปิดค้างไว้บนจอ — รีเฟรชเองทุก 5 นาที แต่หยุดตอนแท็บถูกซ่อน จะได้ไม่ยิงคิวรีทิ้ง
setInterval(() => {
  if (!document.hidden && !window.__BACKUP_DATA__) load();
}, 5 * 60000);

load();
</script>
